<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Facturación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border: 2px solid #000000;
            padding: 60px 50px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            color: #000000;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #666666;
            font-size: 14px;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            background: #000000;
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            max-width: 300px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #333333;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #resultado {
            margin-top: 40px;
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 24px;
            }

            .btn {
                font-size: 13px;
                padding: 16px 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="LOGO_MO_MEXICO_dark.webp" alt="Logo" style="max-width: 140px; height: auto; margin-bottom: 30px;">
        <h1>Generador</h1>
        <p class="subtitle">Facturación Aleatoria</p>
        
        <button class="btn" onclick="generarDatos()">
            Generar Enlace
        </button>

        <div id="resultado">
            <a class="btn" id="btnIr" href="#" target="_blank">
                Ir a Facturación
            </a>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://dev.moglobaleyewear.es/api-facturacion/';
        
        const productosDisponibles = [
            'HI INDEX 1.67 AR',
            'LENTE 1.6 SOL',
            'LENTE TRANSITIONS',
            'BIFOCAL FLAT TOP',
            'PROGRESIVO PREMIUM',
            'ANTI-REFLEJANTE HD',
            'FOTOCROMÁTICO GRIS',
            'POLICARBONATO UV',
            'BLUE LIGHT FILTER',
            'LENTE POLARIZADO',
            'MONOFOCAL CR-39',
            'LENTE ESPEJADO'
        ];

        const preciosMin = [200, 300, 400, 500];
        const preciosMax = [600, 800, 1000, 1200];
        const ivaOpciones = [0, 16];
        const cantidadesOpciones = [1, 2, 3, 4, 5];

        function obtenerAleatorio(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function generarPrecioAleatorio() {
            const min = obtenerAleatorio(preciosMin);
            const max = obtenerAleatorio(preciosMax);
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function generarNumeroProductos() {
            const random = Math.random();
            if (random < 0.4) return 1;
            if (random < 0.7) return 2;
            if (random < 0.9) return 3;
            return 4;
        }

        function crearURL(productos) {
            let ticketNum = Math.floor(Math.random() * 9999) + 1;
            let url = BASE_URL + `?ticket=${ticketNum}`;
            
            productos.forEach((prod, index) => {
                const idx = index + 1;
                // Codificar manualmente los corchetes
                url += `&producto%5B${idx}%5D=${encodeURIComponent(prod.nombre).replace(/%20/g, '+')}`;
                url += `&cantidad%5B${idx}%5D=${prod.cantidad}`;
                url += `&precio%5B${idx}%5D=${prod.precio}`;
                url += `&iva%5B${idx}%5D=${prod.iva}`;
            });
            
            return url;
        }

        function generarDatos() {
            const btnGenerar = document.querySelector('.btn');
            const textoOriginal = btnGenerar.textContent;
            
            // Deshabilitar botón y mostrar spinner
            btnGenerar.disabled = true;
            btnGenerar.innerHTML = textoOriginal + ' <span class="spinner"></span>';
            
            // Simular pequeña carga
            setTimeout(() => {
                const numProductos = generarNumeroProductos();
                const productos = [];
                const productosUsados = [];

                for (let i = 0; i < numProductos; i++) {
                    let productoNombre;
                    do {
                        productoNombre = obtenerAleatorio(productosDisponibles);
                    } while (productosUsados.includes(productoNombre));
                    
                    productosUsados.push(productoNombre);
                    
                    productos.push({
                        nombre: productoNombre,
                        cantidad: obtenerAleatorio(cantidadesOpciones),
                        precio: generarPrecioAleatorio(),
                        iva: obtenerAleatorio(ivaOpciones)
                    });
                }

                const url = crearURL(productos);
                document.getElementById('btnIr').href = url;
                document.getElementById('resultado').style.display = 'block';
                
                // Restaurar botón
                btnGenerar.disabled = false;
                btnGenerar.textContent = 'Generar Otro';
            }, 500);
        }
    </script>
</body>
</html>
